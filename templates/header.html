<!-- ===========================================
     HEADER PARA ADMINISTRADOR
============================================= -->
<header class="navbar navbar-expand navbar-admin sticky-top shadow">
   <!-- Logo y marca -->
  <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3" href="admin-dashboard.html">
      <i class="fas fa-tools me-2"></i> FixPro Admin
  </a>
  
  <!-- Botón para móviles -->
  <button class="navbar-toggler position-absolute d-md-none collapsed" 
          type="button" 
          data-bs-toggle="collapse" 
          data-bs-target="#sidebarMenu">
      <span class="navbar-toggler-icon"></span>
  </button>

  <!-- Barra de búsqueda -->
  <input class="form-control form-control-dark w-100" 
         type="text" 
         placeholder="Buscar..." 
         aria-label="Search"
         id="globalSearch">

  <!-- Menú de usuario -->
  <div class="dropdown ms-2">
      <a href="#" 
         class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" 
         id="dropdownUser" 
         data-bs-toggle="dropdown">
          <img src="../assets/img/profile-placeholder.png" 
               alt="Perfil" 
               width="32" 
               height="32" 
               class="rounded-circle me-2"
               id="headerAvatar">
          <span id="headerUsername">Administrador</span>
      </a>
      <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
          <li>
              <a class="dropdown-item" href="#" onclick="showProfile()">
                  <i class="fas fa-user-cog me-1"></i> Perfil
              </a>
          </li>
          <li>
              <a class="dropdown-item" href="#" onclick="showSystemSettings()">
                  <i class="fas fa-sliders-h me-1"></i> Configuración
              </a>
          </li>
          <li><hr class="dropdown-divider"></li>
          <li>
              <a class="dropdown-item" href="../login.html">
                  <i class="fas fa-sign-out-alt me-1"></i> Cerrar sesión
              </a>
          </li>
      </ul>
  </div>
</header>

<script>
// Actualizar datos del usuario en el header
function updateHeaderUserData() {
  const user = {
      name: "Admin Principal",
      avatar: "../assets/img/admin-avatar.png" // Ruta corregida
  };
  
  document.getElementById('headerUsername').textContent = user.name;
  document.getElementById('headerAvatar').src = user.avatar;
}

// Inicialización cuando el DOM esté listo
document.addEventListener('DOMContentLoaded', function() {
  updateHeaderUserData();
  
  // Configurar la búsqueda global
  document.getElementById('globalSearch').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
          alert('Buscando: ' + this.value); // Implementar lógica real
      }
  });
});
</script>
