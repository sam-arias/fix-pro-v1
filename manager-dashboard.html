<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixPro - Panel Gerencial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="assets/css/manager.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">

</head>
<body class="manager-dashboard">
  <!-- Header -->
  <header class="navbar navbar-expand-md navbar-dark shadow-sm">        
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">
        <i class="fas fa-tools me-2"></i>FixPro <span class="badge bg-light text-dark ms-1">Asesor</span>
      </a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarCollapse">
        <!-- Menú usuario -->
        <div class="dropdown ms-auto">
          <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
            <img src="assets/img/profile-placeholder.png" alt="Asesor" width="36" height="36" class="rounded-circle me-2 border border-2 border-light">
            <span class="d-none d-md-inline" id="username-display"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="dropdownUser">
            <li><a class="dropdown-item" href="#" onclick="showProfile()"><i class="fas fa-user-cog me-2" style="color: var(--color4)"></i> Perfil</a></li>                    
            <li><a class="dropdown-item" href="#" onclick="auth.logout()"><i class="fas fa-sign-out-alt me-2 text-danger"></i> Cerrar sesión</a></li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
        <div class="sidebar-sticky pt-3">
          <ul class="nav flex-column">
            <li class="nav-item">
              <a class="nav-link active" href="#" onclick="showDashboard()">
                <i class="fas fa-tachometer-alt me-2"></i>
                Inicio
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" onclick="showInterventionOrders('all')">
                <i class="fas fa-clipboard-list me-2"></i>
                Órdenes
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" onclick="showSales()">
                <i class="fas fa-chart-line me-2"></i>
                Ventas
              </a>
            </li>
          </ul>
        </div>
      </nav>
      
      <!-- Contenido principal -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4" id="main-content">
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/manager.js" defer></script>
  
</body>
</html>
