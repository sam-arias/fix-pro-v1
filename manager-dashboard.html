<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixPro - Panel Gerencial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/technician.css">
</head>
<body class="technician-dashboard">
  <!-- Header -->
  <header class="navbar navbar-expand-md navbar-dark shadow-sm">        
      <div class="container-fluid">
          <a class="navbar-brand fw-bold" href="technician-dashboard.html">
              <i class="fas fa-tools me-2"></i>FixPro <span class="badge bg-light text-dark ms-1">Manager</span>
          </a>
          
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
              <span class="navbar-toggler-icon"></span>
          </button>
          
          <!-- Menú usuario -->
          <div class="dropdown ms-auto">
              <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser" data-bs-toggle="dropdown">
                  <img src="assets/img/profile-placeholder.png" alt="Técnico" width="36" height="36" class="rounded-circle me-2 border border-2 border-light">
                  <span class="d-none d-md-inline" id="username-display">Técnico</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end shadow">
                  <li><a class="dropdown-item" href="#" onclick="showProfile()"><i class="fas fa-user-cog me-2" style="color: var(--color4)"></i> Perfil</a></li>                    
                  <li><a class="dropdown-item" href="#" onclick="auth.logout()"><i class="fas fa-sign-out-alt me-2 text-danger"></i> Cerrar sesión</a></li>
              </ul>
          </div>
      </div>
  </header>
  
  <div class="container-fluid">
    <div class="row">
      <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse" id="main-sidebar"></nav>
      <!-- Contenido principal -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4" id="main-content">
        <!-- El contenido se carga dinámicamente desde manager.js -->
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/manager.js"></script>
</body>
</html>
