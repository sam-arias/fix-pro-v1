<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Factura</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/Styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg color4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="img/logofixpro.png" alt="Fixpro Logo" class="d-inline-block align-text-top">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link text-white" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="quienes-somos.html">Quiénes Somos</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="Nuestros-Trabajos.html">Nuestros Trabajos</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#contacto">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="Registro.html">Equipos</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="Repuestos.html">Repuestos</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <section class="container mt-5">
        <h1 class="text-center">Generar Factura</h1>
        <form id="generar-factura" action="/generar-factura" method="POST" class="color1 p-4 rounded">
            <h2>Datos del Cliente</h2>
            <div class="mb-3">
                <label for="nombre_cliente" class="form-label">Nombre</label>
                <input type="text" id="nombre_cliente" name="nombre_cliente" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="direccion_cliente" class="form-label">Dirección</label>
                <input type="text" id="direccion_cliente" name="direccion_cliente" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="telefono_cliente" class="form-label">Teléfono</label>
                <input type="tel" id="telefono_cliente" name="telefono_cliente" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="correo_cliente" class="form-label">Correo Electrónico</label>
                <input type="email" id="correo_cliente" name="correo_cliente" class="form-control" required>
            </div>

            <h2>Detalles del Equipo</h2>
            <div class="mb-3">
                <label for="id_equipo" class="form-label">ID Equipo</label>
                <input type="text" id="id_equipo" name="id_equipo" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="marca_equipo" class="form-label">Marca</label>
                <input type="text" id="marca_equipo" name="marca_equipo" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="modelo_equipo" class="form-label">Modelo</label>
                <input type="text" id="modelo_equipo" name="modelo_equipo" class="form-control" required>
            </div>

            <h2>Detalles de la Factura</h2>
            <div class="mb-3">
                <label for="id_orden" class="form-label">ID Orden</label>
                <input type="text" id="id_orden" name="id_orden" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="fecha_factura" class="form-label">Fecha</label>
                <input type="date" id="fecha_factura" name="fecha_factura" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="descripcion_servicio" class="form-label">Descripción del Servicio</label>
                <textarea id="descripcion_servicio" name="descripcion_servicio" rows="4" class="form-control" required></textarea>
            </div>
            <div class="mb-3">
                <label for="costo_servicio" class="form-label">Costo del Servicio</label>
                <input type="number" id="costo_servicio" name="costo_servicio" class="form-control" step="0.01" required>
            </div>
            <div class="mb-3">
                <label for="costo_repuestos" class="form-label">Costo de Repuestos</label>
                <input type="number" id="costo_repuestos" name="costo_repuestos" class="form-control" step="0.01" required>
            </div>
            <div class="mb-3">
                <label for="total_factura" class="form-label">Total</label>
                <input type="number" id="total_factura" name="total_factura" class="form-control" step="0.01" required readonly>
            </div>

            <button type="submit" class="btn color3">Generar Factura</button>
        </form>
    </section>
    <footer class="text-center mt-5 color4">
        <p>&copy; 2024 FixPro. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
