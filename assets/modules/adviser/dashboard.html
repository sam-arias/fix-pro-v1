<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Asesor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/global.css">
</head>
<body>
    <!-- Header -->
    <header class="navbar navbar-expand-md navbar-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fas fa-tools me-2"></i>FixPro <span class="badge bg-light text-dark ms-1">Asesor</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="dropdown ms-auto">
                    <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
                        <img src="assets/img/profile-placeholder.png" alt="Asesor" width="36" height="36" class="rounded-circle me-2 border border-2 border-light">
                        <span class="d-none d-md-inline" id="username-display"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="dropdownUser">
                        <li><a class="dropdown-item" href="#"><i class="fas fa-user-cog me-2" style="color: var(--color4)"></i> Perfil</a></li>
                        <li><a class="dropdown-item" href="#"><i class="fas fa-sign-out-alt me-2 text-danger"></i> Cerrar sesión</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse vh-100" style="min-height:100vh;">
                <div class="sidebar-sticky pt-3 h-100 d-flex flex-column">
                    <ul class="nav flex-column mb-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">
                                <i class="fas fa-tachometer-alt me-2"></i>
                                Inicio
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/assets/modules/adviser/Orders.html">
                                <i class="fas fa-clipboard-list me-2"></i>
                                Órdenes
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/assets/modules/adviser/ventas.html">
                                <i class="fas fa-chart-line me-2"></i>
                                Ventas
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4" id="main-content">
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card stat-card bg-primary text-white">
                            <div class="card-body">
                                <h5 class="card-title">Órdenes Totales</h5>
                                <h2 class="card-stat" id="ordersTotal">0</h2>
                            </div>
                            <i class="fas fa-clipboard-list fa-2x opacity-50"></i>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card stat-card bg-success text-white">
                            <div class="card-body">
                                <h5 class="card-title">En Reparación</h5>
                                <h2 class="card-stat" id="ordersCompleted">0</h2>
                            </div>
                            <i class="fas fa-tools fa-2x opacity-50"></i>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card stat-card bg-warning text-white">
                            <div class="card-body">
                                <h5 class="card-title">Órdenes Pendientes</h5>
                                <h2 class="card-stat" id="ordersPending">0</h2>
                            </div>
                            <i class="fas fa-clock fa-2x opacity-50"></i>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card stat-card bg-info text-white">
                            <div class="card-body">
                                <h5 class="card-title">Listo para entregar</h5>
                                <h2 class="card-stat" id="ordersReady">0</h2>
                            </div>
                            <i class="fas fa-check-circle fa-2x opacity-50"></i>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5>Órdenes recientes</h5>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-hover">
                                        <thead>
                                            <tr>
                                                <th>Orden #</th>
                                                <th>Cliente</th>
                                                <th>Dispositivo</th>
                                                <th>Estado</th>
                                                <th>Total</th>
                                            </tr>
                                        </thead>
                                        <tbody id="recentOrdersTable">
                                            <!-- Órdenes recientes aquí -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5>Ventas por categoría</h5>
                            </div>
                            <div class="card-body">
                                <canvas id="salesChart" height="150"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Simulated data for demonstration
        const managerData = {
            stats: {
                orders: 120,
                completed: 80,
                pending: 30,
                sales: 10
            },
            recentOrders: [
                {id: 101, client: "Juan Pérez", device: "iPhone 12", status: "Completada", total: 250},
                {id: 102, client: "María García", device: "Samsung S21", status: "En progreso", total: 180},
                {id: 103, client: "Pedro Ruiz", device: "iPad Air", status: "Pendiente", total: 90}
            ],
            salesByCategory: [
                {category: "Smartphones", sales: 1200},
                {category: "Tablets", sales: 800},
                {category: "Laptops", sales: 600}
            ]
        };

        // Fill stats
        document.getElementById('ordersTotal').textContent = managerData.stats.orders;
        document.getElementById('ordersCompleted').textContent = managerData.stats.completed;
        document.getElementById('ordersPending').textContent = managerData.stats.pending;
        document.getElementById('ordersReady').textContent = managerData.stats.sales;

        // Fill recent orders table
        document.getElementById('recentOrdersTable').innerHTML = managerData.recentOrders.map(order => `
            <tr>
                <td>${order.id}</td>
                <td>${order.client}</td>
                <td>${order.device}</td>
                <td>
                    <span class="badge ${
                        order.status === 'Completada' ? 'bg-success' :
                        order.status === 'En progreso' ? 'bg-warning' : 'bg-info'
                    }">${order.status}</span>
                </td>
                <td>$${order.total}</td>
            </tr>
        `).join('');

        // Init sales chart
        const ctx = document.getElementById('salesChart').getContext('2d');
        const labels = managerData.salesByCategory.map(item => item.category);
        const data = managerData.salesByCategory.map(item => item.sales);

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Ventas ($)',
                    data: data,
                    backgroundColor: [
                        'rgba(78, 115, 223, 0.8)',
                        'rgba(28, 200, 138, 0.8)',
                        'rgba(231, 74, 59, 0.8)'
                    ],
                    borderColor: [
                        'rgba(78, 115, 223, 1)',
                        'rgba(28, 200, 138, 1)',
                        'rgba(231, 74, 59, 1)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    }
                }
            }
        });
    </script>
</body>
</html>
