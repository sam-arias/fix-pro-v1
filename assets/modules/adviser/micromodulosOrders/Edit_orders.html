<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Orden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/global.css">
</head>
<body>
    <!-- Header -->
    <header class="navbar navbar-expand-md navbar-dark shadow-sm bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fas fa-tools me-2"></i>FixPro <span class="badge bg-light text-dark ms-1">Admin</span>
            </a>
        </div>
    </header>

    <div class="container mt-5 pt-4">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Editar Orden</h1>
            <a href="../Orders.html" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-2"></i>Volver
            </a>
        </div>
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-8">
                <div class="card shadow">
                    <div class="card-body">
                        <form id="orderEditForm">
                            <div class="row">
                                <div class="col-md-6">
                                    <h5 class="mb-3"><i class="fas fa-user me-2"></i>Datos del Cliente</h5>
                                    <div class="mb-3">
                                        <label for="clientName" class="form-label">Nombre</label>
                                        <input type="text" class="form-control" id="clientName" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="clientLastName" class="form-label">Apellido</label>
                                        <input type="text" class="form-control" id="clientLastName" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="clientPhone" class="form-label">Teléfono</label>
                                        <input type="tel" class="form-control" id="clientPhone" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="clientAddress" class="form-label">Dirección</label>
                                        <input type="text" class="form-control" id="clientAddress" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <h5 class="mb-3"><i class="fas fa-laptop me-2"></i>Datos del Dispositivo</h5>
                                    <div class="mb-3">
                                        <label for="deviceType" class="form-label">Tipo de dispositivo</label>
                                        <select class="form-select" id="deviceType" required>
                                            <option value="">Seleccionar...</option>
                                            <option value="Smartphone">Smartphone</option>
                                            <option value="Tablet">Tablet</option>
                                            <option value="Laptop">Laptop</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="deviceModel" class="form-label">Modelo</label>
                                        <input type="text" class="form-control" id="deviceModel" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="deviceMarca" class="form-label">Marca</label>
                                        <input type="text" class="form-control" id="deviceMarca" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="deviceSerial" class="form-label">Serial</label>
                                        <input type="text" class="form-control" id="deviceSerial" required>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="problemDescription" class="form-label">Descripción del problema</label>
                                <textarea class="form-control auto-expand" id="problemDescription" rows="2" required style="min-height: 100px; overflow-y: hidden;"></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="technician" class="form-label">Técnico asignado</label>
                                        <select class="form-select" id="technician">
                                            <option value="">Sin asignar</option>
                                            <!-- Técnicos dinámicos -->
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="estimatedDate" class="form-label">Fecha y hora estimada</label>
                                        <input type="datetime-local" class="form-control" id="estimatedDate">
                                    </div>
                                </div>
                            </div>
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-3">
                                <a href="../Orders.html" class="btn btn-secondary me-md-2">Cancelar</a>
                                <button type="submit" class="btn btn-primary btn-add">Guardar Cambios</button>
                            </div>
                            <script>
                                document.getElementById('orderForm').addEventListener('submit', function(e) {
                                    e.preventDefault();
                                    // Aquí puedes agregar la lógica para guardar la orden (AJAX, etc.)
                                    window.location.href = "../Orders.html";
                                });
                            </script>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
