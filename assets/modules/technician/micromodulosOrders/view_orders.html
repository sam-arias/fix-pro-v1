<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de Orden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/global.css">
</head>
<body>
    <!-- Header -->
    <header class="navbar navbar-expand-md navbar-dark shadow-sm bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fas fa-tools me-2"></i>FixPro <span class="badge bg-light text-dark ms-1">Technician</span>
            </a>
        </div>
    </header>

    <div class="container mt-5 pt-4">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Detalles de la Orden</h1>
            <a href="../Orders.html" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-2"></i>Volver
            </a>
        </div>
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-8">
                <div class="card shadow">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <h5 class="mb-3"><i class="fas fa-file-alt me-2"></i>Detalles de la Orden</h5>
                                <p><strong>Orden #:</strong> <!-- Número dinámico --></p>
                                <p><strong>Estado:</strong> <!-- Estado dinámico --></p>
                            </div>
                            <div class="col-md-6">
                                <h5 class="mb-3"><i class="fas fa-user me-2"></i>Datos del Cliente</h5>
                                <p><strong>Nombre:</strong> <!-- Nombre dinámico --></p>
                                <p><strong>Apellido:</strong> <!-- Apellido dinámico --></p>
                                <p><strong>Teléfono:</strong> <!-- Teléfono dinámico --></p>
                                <p><strong>Dirección:</strong> <!-- Dirección dinámica --></p>
                            </div>
                        </div>
                        <div class="row mt-4">
                            <div class="col-md-6">
                                <h5 class="mb-3"><i class="fas fa-laptop me-2"></i>Datos del Dispositivo</h5>
                                <p><strong>Tipo:</strong> <!-- Tipo dinámico --></p>
                                <p><strong>Modelo:</strong> <!-- Modelo dinámico --></p>
                                <p><strong>Marca:</strong> <!-- Marca dinámica --></p>
                                <p><strong>Serial:</strong> <!-- Serial dinámico --></p>
                            </div>
                            <div class="col-md-6">
                                <h5 class="mb-3"><i class="fas fa-user-cog me-2"></i>Información Adicional</h5>
                                <p><strong>Técnico Asignado:</strong> <!-- Técnico dinámico --></p>
                                <p><strong>Fecha Estimada:</strong> <!-- Fecha dinámica --></p>
                            </div>
                        </div>
                        <hr>
                        <h5 class="mb-3"><i class="fas fa-exclamation-circle me-2"></i>Problema Reportado</h5>
                        <p><!-- Descripción dinámica --></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
