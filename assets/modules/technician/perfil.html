<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/global.css">
</head>
<body>
    <!-- Header -->
    <header class="navbar navbar-expand-md navbar-dark shadow-sm bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fas fa-tools me-2"></i>FixPro <span class="badge bg-light text-dark ms-1">Technician</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="dropdown ms-auto">
                <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="/assets/img/profile-placeholder.png" alt="Admin" width="36" height="36" class="rounded-circle me-2 border border-2 border-light">
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="dropdownUser">
                    <li><a class="dropdown-item" href="perfil.html"><i class="fas fa-user-cog me-2" style="color: var(--color4)"></i> Perfil</a></li>
                    <li><a class="dropdown-item" href="#"><i class="fas fa-sign-out-alt me-2 text-danger"></i> Cerrar sesión</a></li>
                </ul>
            </div>
        </div>
    </header>

    <div class="container mt-5 pt-4">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Mi Perfil</h1>
            <div>
                <a href="/views/technician-dashboard.html" class="btn btn-secondary me-2">
                    <i class="fas fa-arrow-left me-1"></i> Volver
                </a>
                <a href="micromodulos_perfil/editPerfil.html" class="btn btn-warning">
                    <i class="fas fa-edit me-1"></i> Editar Perfil
                </a>
            </div>
        </div>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <img id="profileAvatar"
                                 src="/assets/img/profile-placeholder.png"
                                 alt="Avatar"
                                 class="rounded-circle mb-3 profile-avatar"
                                 width="120"
                                 height="120">
                        </div>
                        <h5 class="card-title mb-4"><i class="fas fa-user me-2"></i>Datos del Perfil</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-uppercase text-muted">Nombre</label>
                                <p class="form-control-plaintext fs-5" id="profileName">Nombre</p>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-uppercase text-muted">Apellidos</label>
                                <p class="form-control-plaintext fs-5" id="profileLastName">Apellido</p>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-uppercase text-muted">Correo electrónico</label>
                                <p class="form-control-plaintext fs-5" id="profileEmail">correo@ejemplo.com</p>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-uppercase text-muted">Teléfono</label>
                                <p class="form-control-plaintext fs-5" id="profilePhone">-</p>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold text-uppercase text-muted">Dirección</label>
                            <p class="form-control-plaintext fs-5" id="profileAddress">-</p>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold text-uppercase text-muted">Rol</label>
                            <p class="form-control-plaintext fs-5" id="profileRole">Rol</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simulated data for demonstration purposes
        const profileData = JSON.parse(localStorage.getItem('profileData')) || {
            name: "Nombre",
            lastName: "Apellido",
            email: "correo@ejemplo.com",
            phone: "-",
            address: "-",
            role: "Rol"
        };

        document.getElementById('profileName').textContent = profileData.name;
        document.getElementById('profileLastName').textContent = profileData.lastName;
        document.getElementById('profileEmail').textContent = profileData.email;
        document.getElementById('profilePhone').textContent = profileData.phone || "-";
        document.getElementById('profileAddress').textContent = profileData.address || "-";
        document.getElementById('profileRole').textContent = profileData.role;
    </script>
</body>
</html>
