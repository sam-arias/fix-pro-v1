<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Personal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="navbar navbar-expand-md navbar-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fas fa-tools me-2"></i>FixPro <span class="badge bg-light text-dark ms-1">Admin</span>
            </a>
        </div>
    </header>

    <div class="container mt-5 pt-4">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Editar Personal</h1>
            <a href="../Personal.html" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-2"></i>Volver
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <form id="editPersonalForm">
                    <h5 class="mb-3"><i class="fas fa-user-tie me-2"></i>Datos personales</h5>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="personName" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="personName" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="personLastName" class="form-label">Apellidos</label>
                                <input type="text" class="form-control" id="personLastName" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="personEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="personEmail" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="personPhone" class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" id="personPhone">
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="personAddress" class="form-label">Dirección</label>
                        <input type="text" class="form-control" id="personAddress">
                    </div>

                    <h5 class="mb-3 mt-4"><i class="fas fa-user-tag me-2"></i>Rol</h5>
                    <div class="mb-3">
                        <select class="form-select" id="personRole" required>
                            <option value="Técnico">Técnico</option>
                            <option value="Asesor">Asesor</option>
                            <option value="Administrador">Administrador</option>
                        </select>
                    </div>
                    
                    <div class="mb-3 mt-4">
                        <label class="form-label">Estado</label>
                        <select class="form-select" id="personStatus" required>
                            <option value="Disponible">Disponible</option>
                            <option value="Inactivo">Inactivo</option>
                        </select>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="../Personal.html" class="btn btn-secondary me-md-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load person data from localStorage
        const personData = JSON.parse(localStorage.getItem('selectedPerson')) || {
            name: "",
            lastName: "",
            email: "",
            phone: "",
            address: "",
            role: "Técnico",
            status: "Disponible"
        };

        // Populate the form with person data
        document.getElementById('personName').value = personData.name;
        document.getElementById('personLastName').value = personData.lastName;
        document.getElementById('personEmail').value = personData.email;
        document.getElementById('personPhone').value = personData.phone;
        document.getElementById('personAddress').value = personData.address;
        document.getElementById('personRole').value = personData.role;
        document.getElementById('personStatus').value = personData.status;

        // Handle form submission
        document.getElementById('editPersonalForm').addEventListener('submit', function(event) {
            event.preventDefault();

            // Update person data
            const updatedPerson = {
                name: document.getElementById('personName').value,
                lastName: document.getElementById('personLastName').value,
                email: document.getElementById('personEmail').value,
                phone: document.getElementById('personPhone').value,
                address: document.getElementById('personAddress').value,
                role: document.getElementById('personRole').value,
                status: document.getElementById('personStatus').value
            };

            // Save updated data to localStorage (or send to server in a real app)
            localStorage.setItem('selectedPerson', JSON.stringify(updatedPerson));
            alert('Cambios guardados exitosamente.');
            window.location.href = "../Personal.html";
        });
    </script>
</body>
</html>
