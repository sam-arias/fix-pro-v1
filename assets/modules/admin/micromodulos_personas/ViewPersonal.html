<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Detalles de Personal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/global.css">
</head>
<body>
    <!-- Header -->
    <header class="navbar navbar-expand-md navbar-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fas fa-tools me-2"></i>FixPro <span class="badge bg-light text-dark ms-1">Admin</span>
            </a>
        </div>
    </header>

    <div class="container mt-5 pt-4">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Detalles de Personal</h1>
            <a href="../Personal.html" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-2"></i>Volver
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <h5 class="mb-3"><i class="fas fa-user-tie me-2"></i>Datos personales</h5>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-uppercase text-muted">Nombre</label>
                            <p class="form-control-plaintext fs-5" id="personName">Juan Pérez</p>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-uppercase text-muted">Apellidos</label>
                            <p class="form-control-plaintext fs-5" id="personLastName">Pérez</p>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-uppercase text-muted">Email</label>
                            <p class="form-control-plaintext fs-5" id="personEmail">juan@example.com</p>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-uppercase text-muted">Teléfono</label>
                            <p class="form-control-plaintext fs-5" id="personPhone">555-1234</p>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-uppercase text-muted">Dirección</label>
                    <p class="form-control-plaintext fs-5" id="personAddress">Calle 123, Ciudad</p>
                </div>

                <h5 class="mb-3 mt-4"><i class="fas fa-user-tag me-2"></i>Rol</h5>
                <div class="mb-3">
                    <label class="form-label fw-bold text-uppercase text-muted">Rol</label>
                    <p class="form-control-plaintext fs-5" id="personRole">Técnico</p>
                </div>
                
                <div class="mb-3 mt-4">
                    <label class="form-label fw-bold text-uppercase text-muted">Estado</label>
                    <p class="form-control-plaintext fs-5" id="personStatus">
                        <span class="badge bg-success">Disponible</span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simulated data for demonstration purposes
        const personData = JSON.parse(localStorage.getItem('selectedPerson')) || {
            name: "Juan",
            lastName: "Pérez",
            email: "juan@example.com",
            phone: "555-1234",
            address: "Calle 123, Ciudad",
            role: "Técnico",
            status: "Disponible"
        };

        // Populate the view with person data
        document.getElementById('personName').textContent = personData.name;
        document.getElementById('personLastName').textContent = personData.lastName;
        document.getElementById('personEmail').textContent = personData.email;
        document.getElementById('personPhone').textContent = personData.phone || "N/A";
        document.getElementById('personAddress').textContent = personData.address || "N/A";
        document.getElementById('personRole').textContent = personData.role;
        document.getElementById('personStatus').innerHTML = `
            <span class="badge ${personData.status === "Disponible" ? "bg-success" : "bg-secondary"}">
                ${personData.status}
            </span>
        `;
    </script>
</body>
</html>
