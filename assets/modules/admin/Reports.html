            <div class="dropdown ms-auto">
                <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3 vh-100">
                    <ul class="nav flex-column">
                        <li class="nav-item">

                        <li class="nav-item">
                            <a class="nav-link" href="Repuestos.html">
                                <i class="fas fa-box-open me-2"></i> Repuestos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Personal.html">
                                <i class="fas fa-users-cog me-2"></i> Personal
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Orders.html">
                                <i class="fas fa-clipboard-list me-2"></i> Órdenes
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="Reports.html">

                    </ul>
                    <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted text-uppercase small">

                    <ul class="nav flex-column mb-2">

                        <li class="nav-item">

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Reportes y Estadísticas</h1>
                    <div>
                        <button class="btn btn-success me-2" id="btnExcel">
                            <i class="fas fa-file-excel me-1"></i>Excel
                        </button>
                        <button class="btn btn-danger" id="btnPDF">
                            <i class="fas fa-file-pdf me-1"></i>PDF
                        </button>
                    </div>
                </div>
                <div class="row mb-4">
                    <div class="col-lg-6 col-xl-4 mb-4">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title"><i class="fas fa-chart-pie me-2"></i>Órdenes por estado</h5>
                                <canvas id="statusChart" height="250"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-xl-4 mb-4">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title"><i class="fas fa-chart-bar me-2"></i>Órdenes mensuales</h5>
                                <canvas id="monthlyChart" height="250"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6 col-xl-4 mb-4">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title"><i class="fas fa-tools me-2"></i>Tipos de problemas reportados</h5>
                                <canvas id="problemTypeChart" height="250"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-xl-4 mb-4">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title"><i class="fas fa-users me-2"></i>Productividad por técnico</h5>
                                <canvas id="productivityChart" height="250"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script>
    // Simulación de datos para demo
    const ordersData = [
        {status: 'Completada', date: '10/06/2024', problem: 'Pantalla rota', technician: 'Carlos López'},
        {status: 'Pendiente', date: '11/06/2024', problem: 'Batería', technician: 'Juan Pérez'},
        {status: 'En progreso', date: '12/06/2024', problem: 'Puerto de carga', technician: 'Carlos López'},
        {status: 'Completada', date: '13/06/2024', problem: 'Pantalla rota', technician: 'María García'},
        {status: 'Pendiente', date: '14/06/2024', problem: 'Cámara', technician: 'Juan Pérez'},
        {status: 'Completada', date: '15/06/2024', problem: 'Batería', technician: 'Carlos López'},
        {status: 'En progreso', date: '16/06/2024', problem: 'Pantalla rota', technician: 'María García'},
        {status: 'Completada', date: '17/06/2024', problem: 'Puerto de carga', technician: 'Juan Pérez'}
    ];
    const adminData = {
        technicians: [
            {name: 'Carlos López'},
            {name: 'Juan Pérez'},
            {name: 'María García'}
        ]
    };

    document.addEventListener('DOMContentLoaded', function() {
        initReportCharts();

        document.getElementById('btnExcel').addEventListener('click', function() {
            alert('Exportando a Excel...');
        });
        document.getElementById('btnPDF').addEventListener('click', function() {
            alert('Exportando a PDF...');
        });
    });

    function initReportCharts() {
        // Órdenes por estado
        const orderStatuses = ordersData.reduce((acc, order) => {
            acc[order.status] = (acc[order.status] || 0) + 1;
            return acc;
        }, {});
        // Órdenes mensuales
        const monthlyOrders = Array(12).fill(0);
        ordersData.forEach(order => {
            const [d, m, y] = order.date.split('/');
            const month = parseInt(m, 10) - 1;
            if (!isNaN(month)) monthlyOrders[month]++;
        });
        // Tipos de problemas
        const problemTypes = ordersData.reduce((acc, order) => {
            acc[order.problem] = (acc[order.problem] || 0) + 1;
            return acc;
        }, {});
        // Productividad por técnico
        const technicianProductivity = adminData.technicians.map(tech => {
            return ordersData.filter(order => order.technician === tech.name && order.status === 'Completada').length;
        });

        // Chart: Órdenes por estado
        new Chart(document.getElementById('statusChart'), {
            type: 'pie',
            data: {
                labels: Object.keys(orderStatuses),
                datasets: [{
                    data: Object.values(orderStatuses),
                    backgroundColor: ['#10b981', '#f59e0b', '#3b82f6', '#dc2626']
                }]
            }
        });

        // Chart: Órdenes mensuales
        new Chart(document.getElementById('monthlyChart'), {
            type: 'bar',
            data: {
                labels: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'],
                datasets: [{
                    label: 'Órdenes',
                    data: monthlyOrders,
                    backgroundColor: 'rgba(54, 162, 235, 0.7)'
                }]
            }
        });

        // Chart: Tipos de problemas reportados
        new Chart(document.getElementById('problemTypeChart'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(problemTypes),
                datasets: [{
                    data: Object.values(problemTypes),
                    backgroundColor: ['#2563eb', '#64748b', '#10b981', '#f59e0b', '#dc2626']
                }]
            }
        });

        // Chart: Productividad por técnico
        new Chart(document.getElementById('productivityChart'), {
            type: 'bar',
            data: {
                labels: adminData.technicians.map(t => t.name.split(' ')[0]),
                datasets: [{
                    label: 'Órdenes completadas',
                    data: technicianProductivity,
                    backgroundColor: 'rgba(100, 116, 139, 0.7)'
                }]
            }
        });
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
