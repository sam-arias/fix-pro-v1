<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Repuesto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="navbar navbar-expand-md navbar-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fas fa-tools me-2"></i>FixPro <span class="badge bg-light text-dark ms-1">Admin</span>
            </a>
        </div>
    </header>

    <div class="container mt-5 pt-4">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Detalles del Repuesto</h1>
            <a href="../Repuestos.html" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-2"></i>Volver
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <h5 class="mb-3"><i class="fas fa-box-open me-2"></i>Información del Repuesto</h5>
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>Código:</strong> <span id="repuestoCode">RP12345</span></p>
                        <p><strong>Tipo:</strong> <span id="repuestoType">Pantalla</span></p>
                        <p><strong>Marca:</strong> <span id="repuestoBrand">Samsung</span></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Modelo:</strong> <span id="repuestoModel">Galaxy S21</span></p>
                        <p><strong>Precio Unitario:</strong> <span id="repuestoPrice">$120.00</span></p>
                        <p><strong>Stock:</strong> <span id="repuestoStock">15</span></p>
                    </div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                    <a href="EditRepuesto.html" class="btn btn-warning">
                        <i class="fas fa-edit me-1"></i> Editar Repuesto
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simulated data for demonstration purposes
        const repuestoData = JSON.parse(localStorage.getItem('selectedRepuesto')) || {
            code: "RP12345",
            type: "Pantalla",
            brand: "Samsung",
            model: "Galaxy S21",
            price: 120.00,
            stock: 15
        };

        // Populate the view with repuesto data
        document.getElementById('repuestoCode').textContent = repuestoData.code;
        document.getElementById('repuestoType').textContent = repuestoData.type;
        document.getElementById('repuestoBrand').textContent = repuestoData.brand;
        document.getElementById('repuestoModel').textContent = repuestoData.model;
        document.getElementById('repuestoPrice').textContent = `$${repuestoData.price.toFixed(2)}`;
        document.getElementById('repuestoStock').textContent = repuestoData.stock;
    </script>
</body>
</html>
