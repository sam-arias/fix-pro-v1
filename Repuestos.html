    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/Styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg color4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="img/logofixpro.png" alt="Fixpro Logo" class="d-inline-block align-text-top">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="quienes-somos.html">Quiénes Somos</a></li>
                    <li class="nav-item"><a class="nav-link" href="Nuestros-Trabajos.html">Nuestros Trabajos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link" href="Registro.html">Equipos</a></li>
                    <li class="nav-item"><a class="nav-link" href="Repuestos.html">Repuestos</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <section class="container mt-5">
        <h1 class="text-center">Gestión de Inventario de Repuestos</h1>
        
        <div class="mt-4">
            <form id="agregar-repuesto" action="/agregar-repuesto" method="POST" class="color1 p-4 rounded">
                <h2>Registrar Nuevo Repuesto</h2>
                <div class="mb-3">
                    <label for="codigo_repuesto" class="form-label">Código Repuesto</label>
                    <input type="text" id="codigo_repuesto" name="codigo_repuesto" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <input type="text" id="descripcion" name="descripcion" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="cantidad" class="form-label">Cantidad</label>
                    <input type="number" id="cantidad" name="cantidad" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="costo" class="form-label">Costo</label>
                    <input type="number" id="costo" name="costo" class="form-control" step="0.01" required>
                </div>
                <button type="submit" class="btn color3">Agregar</button>
            </form>
        </div>

        <div class="mt-4">
            <form id="consultar-repuesto" action="/consultar-repuesto" method="GET" class="color1 p-4 rounded">
                <h2>Consultar Existencia</h2>
                <div class="mb-3">
                    <label for="codigo_repuesto_consulta" class="form-label">Código Repuesto</label>
                    <input type="text" id="codigo_repuesto_consulta" name="codigo_repuesto" class="form-control" required>
                </div>
                <button type="submit" class="btn color3">Consultar</button>
            </form>
        </div>

        <div class="mt-4">
            <form id="actualizar-inventario" action="/actualizar-inventario" method="POST" class="color1 p-4 rounded">
                <h2>Actualizar Inventario</h2>
                <div class="mb-3">
                    <label for="codigo_repuesto_actualizar" class="form-label">Código Repuesto</label>
                    <input type="text" id="codigo_repuesto_actualizar" name="codigo_repuesto" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="cantidad_actualizar" class="form-label">Cantidad</label>
                    <input type="number" id="cantidad_actualizar" name="cantidad" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="accion" class="form-label">Acción</label>
                    <select id="accion" name="accion" class="form-select" required>
                        <option value="ingresar">Ingresar al Inventario</option>
                        <option value="retirar">Retirar del Inventario</option>
                    </select>
                </div>
                <button type="submit" class="btn color3">Actualizar</button>
            </form>
        </div>
    </section>

    <footer class="text-center mt-5 color4">
        <p>&copy; 2024 Inventario de Repuestos. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
