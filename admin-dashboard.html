<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixPro - Panel de Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="assets/css/admin.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="admin-dashboard">
    <!-- Header -->
    <header class="navbar navbar-expand-md navbar-dark fixed-top shadow-sm">        
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fas fa-tools me-2"></i>FixPro <span class="badge bg-light text-dark ms-1">Admin</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Menú usuario -->
            <div class="dropdown ms-auto">
                <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser" data-bs-toggle="dropdown">
                    <img src="assets/img/profile-placeholder.png" alt="Admin" width="36" height="36" class="rounded-circle me-2 border border-2 border-light">
                    <span class="d-none d-md-inline">Administrador</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow">
                    <li><a class="dropdown-item" href="#" onclick="showProfile()"><i class="fas fa-user-cog me-2" style="color: var(--color4)"></i> Perfil</a></li>
                    <li><a class="dropdown-item" href="#" onclick="showSystemSettings()"><i class="fas fa-sliders-h me-2" style="color: var(--color4)"></i> Configuración</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="#" onclick="showLogoutConfirmation()"><i class="fas fa-sign-out-alt me-2 text-danger"></i> Cerrar sesión</a></li>
                </ul>
            </div>
        </div>
    </header>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block sidebar collapse bg-light">
                <div class="position-sticky pt-3 vh-100">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" id="nav-dashboard">
                                <i class="fas fa-tachometer-alt me-2"></i> Inicio
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="nav-parts">
                                <i class="fas fa-box-open me-2"></i> Repuestos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="nav-personal">
                                <i class="fas fa-users-cog me-2"></i> Personal
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="nav-orders">
                                <i class="fas fa-clipboard-list me-2"></i> Órdenes
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="nav-reports">
                                <i class="fas fa-chart-bar me-2"></i> Reportes
                            </a>
                        </li>
                    </ul>

                    <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted text-uppercase small">
                        <span>Configuración</span>
                        <i class="fas fa-cog"></i>
                    </h6>
                    <ul class="nav flex-column mb-2">
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="nav-permissions">
                                <i class="fas fa-user-shield me-2"></i> Permisos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="nav-categories">
                                <i class="fas fa-tags me-2"></i> Categorías
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Contenido principal -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-4 bg-white">
                <!-- Encabezado dinámico -->
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                </div>

                <!-- Contenido dinámico -->
                <div id="mainContent" class="container-fluid p-0">
                    <!-- Se carga dinámicamente con JavaScript -->
                </div>
            </main>
        </div>
    </div>

    <!-- Modal de confirmación para cerrar sesión -->
    <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title" id="logoutModalLabel"><i class="fas fa-sign-out-alt me-2"></i>Confirmar Cierre de Sesión</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            ¿Estás seguro de que deseas cerrar sesión?
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-danger" onclick="auth.logout()">Cerrar Sesión</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Scripts propios -->
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/admin.js"></script>
    
    <script>
    // Verificar autenticación al cargar
    document.addEventListener('DOMContentLoaded', function() {
        // Verificar si el usuario está autenticado
        if (!auth.getCurrentUser()) {
            window.location.href = 'login.html';
            return;
        }
        
        // Verificar si el usuario es admin
        if (!auth.hasRole('administrador')) {
            window.location.href = 'unauthorized.html';
            return;
        }
        
        // Configuración de navegación principal
        const navLinks = {
            'nav-dashboard': loadAdminDashboard,
            'nav-parts': showPartsManagement,
            'nav-personal': showPersonalManagement,
            'nav-orders': showInterventionOrders,
            'nav-reports': showReports,
            'nav-permissions': showPermissionsManagement,
            'nav-categories': showCategoriesManagement
        };
        
        // Configurar event listeners para navegación
        Object.keys(navLinks).forEach(id => {
            const element = document.getElementById(id);
            if (element) {
                element.addEventListener('click', function(e) {
                    e.preventDefault();
                    setActiveNav(this);
                    navLinks[id]();
                });
            }
        });
        
        // Configurar eventos para el menú de usuario
        document.querySelector('[onclick="showProfile()"]')?.addEventListener('click', function(e) {
            e.preventDefault();
            showProfile();
        });
        
        document.querySelector('[onclick="showSystemSettings()"]')?.addEventListener('click', function(e) {
            e.preventDefault();
            showSystemSettings();
        });
        
        // Function to set the active navigation link
        function setActiveNav(activeLink) {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
                link.removeAttribute('aria-current');
            });
            activeLink.classList.add('active');
            activeLink.setAttribute('aria-current', 'page');
        }
        
        // Cargar dashboard por defecto
        loadAdminDashboard();
        setActiveNav(document.getElementById('nav-dashboard'));
        
        // Efecto de navbar al hacer scroll
        const navbar = document.querySelector('.navbar');
        window.addEventListener('scroll', function() {
            navbar.classList.toggle('scrolled', window.scrollY > 50);
        });
    });

    function showLogoutConfirmation() {
        const logoutModal = new bootstrap.Modal(document.getElementById('logoutModal'));
        logoutModal.show();
    }
    </script>
</body>
</html>
