<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixPro - Mi Perfil</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/public/assets/css/main.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 d-md-block sidebar collapse bg-dark">
                <div class="position-sticky pt-3">
                    <div class="text-center mb-4">
                        <i class="bi bi-tools text-white fs-1 mb-2"></i>
                        <h4 class="text-white fs-4">FixPro Management</h4>
                        <p class="text-white fs-6">Panel de Control</p>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item fs-5">
                            <a class="nav-link" href="../dashboard/admin-dashboard.html">
                                <i class="bi bi-house-door me-2"></i>Inicio
                            </a>
                        </li>
                        <li class="nav-item fs-5">
                            <a class="nav-link" href="../inventory/inventory.html">
                                <i class="bi bi-box-seam me-2"></i>Inventario
                            </a>
                        </li>
                        <li class="nav-item fs-5">
                            <a class="nav-link" href="../people/people.html">
                                <i class="bi bi-people me-2"></i>Gestión del Personal
                            </a>
                        </li>
                        <li class="nav-item fs-5">
                            <a class="nav-link active" href="profile.html">
                              <i class="bi bi-person-circle"></i> Mi Perfil
                            </a>
                        </li>
                        <li class="nav-item fs-5">
                            <a class="nav-link" href="#" id="logoutBtn""><i class="fas fa-sign-out-alt fs-5  me-2"></i>Cerrar sesión</a>
                        </li>
                        <li class="nav-item fs-5">
                            <a class="nav-link" href="#">
                                <i class="bi bi-gear me-2"></i>Configuración
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="profile-header">
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3">
                        <h1 class="h2">Mi Perfil</h1>
                    </div>
                    
                    <ul class="nav nav-pills">
                        <li class="nav-item">
                            <a class="nav-link active" id="personal-tab" data-bs-toggle="pill" href="#personal-info">
                                <i class="bi bi-person-lines-fill me-1"></i>Información Personal
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="password-tab" data-bs-toggle="pill" href="#change-password">
                                <i class="bi bi-shield-lock me-1"></i>Cambiar Contraseña
                            </a>
                        </li>
                    </ul>
                </div>

                <div class="tab-content" id="profileTabsContent">
                    <!-- Sección de Información Personal -->
                    <div class="tab-pane fade show active" id="personal-info" role="tabpanel" aria-labelledby="personal-tab">
                        <div class="row justify-content-center">
                            <div class="col-lg-8">
                                <div class="card mb-4">
                                    <div class="card-header">
                                        <h5>Datos Personales</h5>
                                    </div>
                                    <div class="card-body">
                                        <form id="personalInfoForm">
                                            <div class="row mb-3">
                                                <div class="col-md-6">
                                                    <label for="firstName" class="form-label">Nombres</label>
                                                    <input type="text" class="form-control" id="firstName" value="Carlos Alberto" required>
                                                </div>
                                                <div class="col-md-6">
                                                    <label for="lastName" class="form-label">Apellidos</label>
                                                    <input type="text" class="form-control" id="lastName" value="Martínez Fuentes" required>
                                                </div>
                                            </div>
                                            <div class="mb-3">
                                                <label for="email" class="form-label">Correo electrónico</label>
                                                <input type="email" class="form-control" id="email" value="carlos.martinez@taller.com" required>
                                            </div>
                                            <div class="mb-3">
                                                <label for="phone" class="form-label">Teléfono</label>
                                                <input type="tel" class="form-control" id="phone" value="+51 987456123">
                                            </div>
                                            <div class="mb-3">
                                                <label for="address" class="form-label">Dirección</label>
                                                <input type="text" class="form-control" id="address" value="Av. Los Jardines 456, Lima">
                                            </div>
                                            <div class="row mb-3">
                                                <div class="col-md-6">
                                                    <label for="role" class="form-label">Rol</label>
                                                    <input type="text" class="form-control" id="role" value="Administrador" disabled>
                                                </div>
                                                <div class="col-md-6">
                                                    <label for="specialties" class="form-label">Especialidades</label>
                                                    <input type="text" class="form-control" id="specialties" value="Administración, Gestión" disabled>
                                                </div>
                                            </div>
                                            <button type="submit" class="btn btn-primary">
                                                <i class="bi bi-save me-1"></i> Guardar Cambios
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Sección de Cambio de Contraseña -->
                    <div class="tab-pane fade" id="change-password" role="tabpanel" aria-labelledby="password-tab">
                        <div class="row justify-content-center">
                            <div class="col-lg-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h5>Cambiar Contraseña</h5>
                                    </div>
                                    <div class="card-body">
                                        <form id="changePasswordForm">
                                            <div class="mb-3">
                                                <label for="currentPassword" class="form-label">Contraseña Actual</label>
                                                <input type="password" class="form-control" id="currentPassword" required>
                                            </div>
                                            <div class="mb-3">
                                                <label for="newPassword" class="form-label">Nueva Contraseña</label>
                                                <input type="password" class="form-control" id="newPassword" required>
                                                <small class="text-muted">La contraseña debe tener al menos 8 caracteres</small>
                                            </div>
                                            <div class="mb-3">
                                                <label for="confirmPassword" class="form-label">Confirmar Nueva Contraseña</label>
                                                <input type="password" class="form-control" id="confirmPassword" required>
                                            </div>
                                            <button type="submit" class="btn btn-primary">
                                                <i class="bi bi-key me-1"></i> Cambiar Contraseña
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/assets/js/main.js"></script>
</body>
</html>
