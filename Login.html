<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fixpro</title>
    <link rel="icon" type="image/png" href="img/logofixpro.png">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/Styles.css">
    <script src="js/Scrip.js" defer></script>
</head>
<body>
    <section class="container mt-5">
        <div class="text-center">  
            <h1>Fixpro</h1>
            <img src="img/fixpro.png" alt="logo" class="img-fluid"/>
        </div>
        <div class="mt-4">      
            <h1 class="text-center">Inicio de Sesión</h1>
            <form onsubmit="return false;" class="color1 p-4 rounded">
                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuario</label>
                    <input type="text" id="usuario" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="contraseña" class="form-label">Contraseña</label>
                    <input type="password" id="contraseña" class="form-control" required>
                </div>
                <button onclick="login()" class="btn color3">Iniciar sesión</button>
            </form>
        </div>
    </section>
    <footer class="text-center mt-5 color4">
        <p>@Todos los derechos reservados a FixPro</p>
    </footer>
</body>
</html>
