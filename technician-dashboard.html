<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixPro - Dashboard Técnico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/technician.css">
</head>
<body class="technician-dashboard">
    <!-- Header -->
    <header class="navbar navbar-expand-md navbar-dark fixed-top shadow-sm">        
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fas fa-tools me-2"></i>FixPro <span class="badge bg-light text-dark ms-1">Tecnico</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Menú usuario -->
            <div class="dropdown ms-auto">
                <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser" data-bs-toggle="dropdown">
                    <img src="assets/img/profile-placeholder.png" alt="Admin" width="36" height="36" class="rounded-circle me-2 border border-2 border-light">
                    <span class="d-none d-md-inline">Tecnico</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow">
                    <li><a class="dropdown-item" href="#" onclick="showProfile()"><i class="fas fa-user-cog me-2" style="color: var(--color4)"></i> Perfil</a></li>
                    <li><a class="dropdown-item" href="#" onclick="showSystemSettings()"><i class="fas fa-sliders-h me-2" style="color: var(--color4)"></i> Configuración</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="#" onclick="auth.logout()"><i class="fas fa-sign-out-alt me-2 text-danger"></i> Cerrar sesión</a></li>
                </ul>
            </div>
        </div>
    </header>
    <div class="wrapper">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>
        
        <!-- Main Content -->
        <div id="content">
            <!-- Top Navigation -->
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-info">
                        <i class="fas fa-align-left"></i>
                    </button>
                    <h2 class="ms-3">Dashboard Técnico</h2>
                </div>
            </nav>
            
            <!-- Dashboard Content -->
            <div class="container-fluid mt-4">
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card stats-card primary">
                            <div class="card-body">
                                <h5 class="card-title">Asignadas</h5>
                                <h2 class="card-text" id="assigned-count">5</h2>
                                <p class="small text-muted">+1 desde ayer</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stats-card success">
                            <div class="card-body">
                                <h5 class="card-title">Completadas</h5>
                                <h2 class="card-text" id="completed-count">3</h2>
                                <p class="small text-muted">Esta semana</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stats-card warning">
                            <div class="card-body">
                                <h5 class="card-title">Prioritarias</h5>
                                <h2 class="card-text" id="priority-count">2</h2>
                                <p class="small text-muted">Urgentes</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-12">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">
                                    <i class="fas fa-tasks me-2"></i>Mis órdenes asignadas
                                </h5>
                                <div class="table-responsive">
                                    <table class="table table-hover table-assigned-orders" id="assigned-orders-table">
                                        <thead>
                                            <tr>
                                                <th>Orden #</th>
                                                <th>Dispositivo</th>
                                                <th>Problema</th>
                                                <th>Fecha asignación</th>
                                                <th>Estado</th>
                                                <th>Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <!-- Se llena dinámicamente con JavaScript -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/technician.js"></script>
    <script>
        // Cargar sidebar
        fetch('templates/sidebar-tech.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('sidebar-container').innerHTML = data;
                // Verificar autenticación y rol
                checkAuthAndRole('technician');
            });
    </script>
</body>
</html>
