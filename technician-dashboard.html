<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixPro - Dashboard Técnico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/technician.css">
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>
        
        <!-- Main Content -->
        <div id="content">
            <!-- Top Navigation -->
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-info">
                        <i class="fas fa-align-left"></i>
                    </button>
                    <h2 class="ms-3">Dashboard Técnico</h2>
                </div>
            </nav>
            
            <!-- Dashboard Content -->
            <div class="container-fluid mt-4">
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card stats-card primary">
                            <div class="card-body">
                                <h5 class="card-title">Asignadas</h5>
                                <h2 class="card-text" id="assigned-count">5</h2>
                                <p class="small text-muted">+1 desde ayer</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stats-card success">
                            <div class="card-body">
                                <h5 class="card-title">Completadas</h5>
                                <h2 class="card-text" id="completed-count">3</h2>
                                <p class="small text-muted">Esta semana</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stats-card warning">
                            <div class="card-body">
                                <h5 class="card-title">Prioritarias</h5>
                                <h2 class="card-text" id="priority-count">2</h2>
                                <p class="small text-muted">Urgentes</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-12">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">
                                    <i class="fas fa-tasks me-2"></i>Mis órdenes asignadas
                                </h5>
                                <div class="table-responsive">
                                    <table class="table table-hover table-assigned-orders" id="assigned-orders-table">
                                        <thead>
                                            <tr>
                                                <th>Orden #</th>
                                                <th>Dispositivo</th>
                                                <th>Problema</th>
                                                <th>Fecha asignación</th>
                                                <th>Estado</th>
                                                <th>Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <!-- Se llena dinámicamente con JavaScript -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/technician.js"></script>
    <script>
        // Cargar sidebar
        fetch('templates/sidebar-tech.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('sidebar-container').innerHTML = data;
                // Verificar autenticación y rol
                checkAuthAndRole('technician');
            });
    </script>
</body>
</html>
